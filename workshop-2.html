<style>
:root{--paper:#f7f5ef;--ink:#242a26;--sec:#62665c;--line:#d5d7cb;--orange:#bd482d;--hero:#e66b46}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Prompt","Leelawadee UI","Thonburi",sans-serif;padding:16px}
form{width:100%;max-width:360px}

p{color:var(--sec);margin:0 0 18px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}

.err{color:var(--orange);font-size:14px;min-height:20px;margin-top:8px}
.remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sec);margin-top:10px}
.remember input{width:auto;letter-spacing:0}
</style></head>

function u2b(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function derive(pin){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2u(SALT),iterations:ITER,hash:"SHA-256"},base,256);
  return new Uint8Array(bits);
}
async function open_(raw,remember){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var buf=b2u(PAYLOAD);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
  try{sessionStorage.setItem(KEY,u2b(raw));if(remember)localStorage.setItem(KEY,u2b(raw))}catch(e){}
  var html=new TextDecoder().decode(plain).replace("</body>",HOOK+"</body>");
  document.open();document.write(html);document.close();
}
async function auto(){
  var k=null;try{k=sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch(e){}
  if(k){try{await open_(b2u(k),false);return}catch(e){try{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY)}catch(_){}}}
  document.getElementById("pin").focus();
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",auto)}else{auto()}
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();
  var err=document.getElementById("err"); err.textContent="กำลังตรวจรหัส...";
  try{
    var raw=await derive(document.getElementById("pin").value.trim());
    await open_(raw,document.getElementById("rem").checked);
  }catch(e){err.textContent="รหัสไม่ถูกต้อง";}
});
</script>
