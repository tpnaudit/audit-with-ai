<style>
:root{--paper:#f7f5ef;--ink:#242a26;--sec:#62665c;--line:#d5d7cb;--orange:#bd482d;--hero:#e66b46}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Prompt","Leelawadee UI","Thonburi",sans-serif;padding:16px}
form{width:100%;max-width:360px}

p{color:var(--sec);margin:0 0 18px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}

.err{color:var(--orange);font-size:14px;min-height:20px;margin-top:8px}
.remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sec);margin-top:10px}
.remember input{width:auto;letter-spacing:0}
</style></head>
